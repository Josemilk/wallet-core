name: Exchange Backend

on:
  push:
    paths:
      - 'exchange/backend/**'
      - 'exchange/database/**'
      - 'exchange/docs/**'
      - '.github/workflows/exchange-backend.yml'
  pull_request:
    paths:
      - 'exchange/backend/**'
      - 'exchange/database/**'
      - 'exchange/docs/**'
      - '.github/workflows/exchange-backend.yml'
  workflow_dispatch:

concurrency:
  group: exchange-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exchange/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - run: go mod download
      - run: go mod verify
      - run: go test ./... -count=1
      - run: go vet ./...
      - run: go build ./cmd/exchange
