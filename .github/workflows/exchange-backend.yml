name: Exchange Backend
on:
  push:
    paths: ['exchange/backend/**','exchange/database/**']
  pull_request:
    paths: ['exchange/backend/**','exchange/database/**']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exchange/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - run: go mod download
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/exchange
