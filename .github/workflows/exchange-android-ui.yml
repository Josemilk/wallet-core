name: Exchange Android UI

on:
  pull_request:
    branches: [ exchange-phases-14-21 ]
    paths:
      - 'android/**'
      - '.github/workflows/exchange-android-ui.yml'
  workflow_dispatch:

concurrency:
  group: exchange-android-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.10.2
      - name: Compile exchange Android app
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace
