[profile.default]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
src = "src"
test = "test"
out = "out"
libs = ["lib"]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]

[fmt]
line_length = 120

[rpc_endpoints]
# Supply RPC URLs through environment variables in CI/deployment tooling.
